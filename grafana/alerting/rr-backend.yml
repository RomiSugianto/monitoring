              expr: (sum(sum_over_time(sli_logwriter_1m{service="backend",status="success"}[5m] offset 2m)) or 0 * sum(sum_over_time(sli_logwriter_1m{service="backend"}[5m] offset 2m))) / sum(sum_over_time(sli_logwriter_1m{service="backend"}[5m] offset 2m))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
        labels:
          category: availability
          app: backend
        isPaused: false
        record:
          metric: sli_5m
          from: A
          targetDatasourceUid: prometheus
