groups:
  - folder: Recording Rules
    name: SLI Recording Rules backend
    interval: 1m
    rules:
      - uid: sli_backend_sc_5m
        title: sli_success_count_5m
        condition: ""
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum(sli_logwriter_1m{service="backend", status="success"}) or 0 * sum(sli_logwriter_1m{service="backend"})'
              instant: true
              refId: A
        labels:
          category: availability
          app: backend
        noDataState: OK
        execErrState: Error
        isPaused: false
        record:
          metric: sli_success_count_5m
          from: A
          targetDatasourceUid: prometheus
      - uid: sli_backend_tc_5m
        title: sli_total_count_5m
        condition: ""
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum(sli_logwriter_1m{service="backend"})'
              instant: true
              refId: A
        labels:
          category: availability
          app: backend
        noDataState: OK
        execErrState: Error
        isPaused: false
        record:
          metric: sli_total_count_5m
          from: A
          targetDatasourceUid: prometheus
