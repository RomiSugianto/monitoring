groups:
  - folder: Recording Rules
    name: SLI Recording Rules node-exporter
    interval: 1m
    rules:
      - uid: sli_ne_node_cpu_5m
        title: sli_node_cpu_5m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                dstype: prometheus
                uid: prometheus
              expr: |
                avg_over_time(
                  (
                    sum(1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) < bool 0.85)
                    /
                    count(avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))
                  )[5m:1m]
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
        labels:
          sli: node_cpu
          category: capacity
          app: node-exporter
        isPaused: false
        record:
          metric: sli_5m
          from: A
          targetDatasourceUid: prometheus
      - uid: sli_ne_node_cpu_window
        title: sli_node_cpu_window
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                dstype: prometheus
                uid: prometheus
              expr: |
                sum (sum_over_time((sli_5m{app="node-exporter", sli="node_cpu"} < +Inf)[30d:5m])) 
                / 
                sum (count_over_time((sli_5m{app="node-exporter", sli="node_cpu"} < +Inf)[30d:5m]))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
        labels:
          sli: node_cpu
          category: capacity
          app: node-exporter
          window: 30d
        isPaused: false
        record:
          metric: sli_window
          from: A
          targetDatasourceUid: prometheus
      - uid: sli_ne_node_memory_5m
