name: monitoring_stack
services:

    node-exporter:
        image: prom/node-exporter:latest
        container_name: node-exporter
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/rootfs:ro
        command:
            - "--path.procfs=/host/proc"
            - "--path.sysfs=/host/sys"
            - "--path.rootfs=/rootfs"
            # Exclude unnecessary mounts to keep CPU/RAM usage extremely low
            - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
        mem_limit: 32m
        cpus: 0.1
        ports:
            - "9100:9100"
        restart: unless-stopped

    blackbox-exporter:
        image: prom/blackbox-exporter:latest
        container_name: blackbox-exporter
        mem_limit: 32m
        cpus: 0.1
        restart: unless-stopped
        ports:
            - "9115:9115"
        volumes:
            - ./configs/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    logwriter:
        image: alpine:latest
        container_name: logwriter
        volumes:
            - ./services/logwriter/logwriter.sh:/logwriter.sh
            - ./logs:/var/log/logwriter
        command: sh -c 'chmod +x /logwriter.sh; /logwriter.sh'
        mem_limit: 32m
        cpus: 0.1
        restart: unless-stopped

    metricwriter:
        build:
            context: ./services/metricwriter
            dockerfile: Dockerfile
        image: metricwriter:latest
        container_name: metricwriter
        restart: unless-stopped
        environment:
            - PROMETHEUS_REMOTE_WRITE_URL=http://prometheus:9090/api/v1/write
            - POSTGRES_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-monitoring}?sslmode=disable

    mocktail:
        build:
            context: ./services/mocktail
            dockerfile: Dockerfile
        container_name: mocktail
        env_file:
            - ./services/mocktail/.env
        environment:
            - LOKI_URL=http://loki:3100
        ports:
            - "9095:9095"
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--no-verbose",
                    "--tries=1",
                    "--spider",
                    "http://localhost:9095/healthz",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
