groups:
  - folder: Recording Rules
    name: SLI Recording Rules worker
    interval: 1m
    rules:
      - uid: sli_worker_sc_5m
        title: sli_success_count_5m
        condition: ""
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum(sli_logwriter_1m{service="worker", status="success"}) or 0 * sum(sli_logwriter_1m{service="worker"})'
              instant: true
              refId: A
        labels:
          category: availability
          app: worker
        noDataState: OK
        execErrState: Error
        isPaused: false
        record:
          metric: sli_success_count_5m
          from: A
          targetDatasourceUid: prometheus
      - uid: sli_worker_tc_5m
        title: sli_total_count_5m
