            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                dstype: prometheus
                uid: prometheus
              expr: |
                avg_over_time(
                  (
                    sum(
                      (
                        1 - (
                          node_memory_MemAvailable_bytes{}  
                          /
                          node_memory_MemTotal_bytes{}  
                        )
                      ) < bool 0.90  
                    )
                    /
                    count(
                      node_memory_MemAvailable_bytes{}  
                      /
                      node_memory_MemTotal_bytes{}  
                    )
                  )[30m:5m]
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
        labels:
          sli: node_memory
          category: capacity
          app: node-exporter
        isPaused: false
        record:
          metric: sli_5m
          from: A
          targetDatasourceUid: prometheus
