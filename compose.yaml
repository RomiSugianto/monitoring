  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      # Exclude unnecessary mounts to keep CPU/RAM usage extremely low
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    mem_limit: 32m
    cpus: 0.1
    ports:
      - "9100:9100"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-remote-write-receiver'
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasources/:/etc/grafana/provisioning/datasources/:ro
      - ./grafana/dashboards/:/etc/grafana/provisioning/dashboards/:ro
      - ./grafana/alerting/:/etc/grafana/provisioning/alerting/:ro
    environment:
      # Use environment variables for security; do not commit real credentials.
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-}
      - GF_SERVER_HTTP_PORT=3000

      - GF_RECORDING_RULES_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_EXECUTE_ALERTS=true
      - GF_UNIFIED_ALERTING_REMOTE_WRITE_UR=http://prometheus:9090/api/v1/write

    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

volumes:
  lokidata:
  promdata:
  esdata:
  mimirdata:
