name: monitoring_stack
services:
    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - "3000:3000"
        volumes:
            - ./configs/grafana/datasources/:/etc/grafana/provisioning/datasources/:ro
            - ./configs/grafana/dashboards/:/etc/grafana/provisioning/dashboards/:ro
            - ./configs/grafana/alerting/:/etc/grafana/provisioning/alerting/:ro
        environment:
            # Use environment variables for security; do not commit real credentials.
            - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000}
            - GF_SERVER_DOMAIN=${GF_SERVER_DOMAIN:-localhost}
            - GF_SERVER_HTTP_PORT=3000
            - GF_SERVER_DISABLE_PLUGIN_AUTO_INSTALL=true
            - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
            - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-}
            - GF_RECORDING_RULES_ENABLED=true
            - GF_UNIFIED_ALERTING_ENABLED=true
            - GF_UNIFIED_ALERTING_EXECUTE_ALERTS=true
            - GF_UNIFIED_ALERTING_REMOTE_WRITE_UR=http://prometheus:9090/api/v1/write
            - GF_UNIFIED_ALERTING_STATE_HISTORY_BACKEND=prometheus
            - GF_UNIFIED_ALERTING_STATE_HISTORY_PROMETHEUS_WRITE_URL=http://prometheus:9090/api/v1/write
            - GF_UNIFIED_ALERTING_STATE_HISTORY_PROMETHEUS_TARGET_DATA_SOURCE_UID=prometheus
        mem_limit: 256m
        cpus: 0.5
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
            interval: 10s
            timeout: 5s
            retries: 5
