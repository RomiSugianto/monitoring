      - uid: sli_ne_node_disk_5m
        title: sli_node_disk_5m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                dstype: prometheus
                uid: prometheus
              expr: |
                avg_over_time(
                    (
                        sum(
                            (
                                (
                                    rate(node_disk_read_time_seconds_total[1m])
                                    +
                                    rate(node_disk_write_time_seconds_total[1m])
                                )
                                /
                                (
                                    (
                                        rate(node_disk_reads_completed_total[1m])
                                        +
                                        rate(node_disk_writes_completed_total[1m])
                                    ) > 0
                                )
                            ) < bool 0.5
                        )
                        /
                        count(
                            (
                                rate(node_disk_reads_completed_total[1m])
                                +
                                rate(node_disk_writes_completed_total[1m])
                            ) > 0
                        )
                    )[5m:1m]
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
        labels:
          sli: node_disk
          category: performance
          app: node-exporter
        isPaused: false
        record:
          metric: sli_5m
          from: A
          targetDatasourceUid: prometheus
