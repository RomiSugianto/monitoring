groups:
  - folder: Recording Rules
    name: SLI Recording Rules Logwriter
    interval: 1m
    rules:
      - uid: sli_logwriter_1m
        title: sli_logwriter_1m
        labels:  
          slo_name: logwriter
        condition: ""
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              refId: A
              expr: |
                {job=logwriter}
              intervalMs: 60000
              metrics:
                - {id: 1, type: count}
              bucketAggs:
                - {id: 2, type: terms, field: http_code, settings: {interval: 1m, min_doc_count: 1, order: desc, orderBy: _term, size: 100}}
                - {id: 3, type: terms, field: status, settings: {interval: 1m, min_doc_count: 1, order: desc, orderBy: _term, size: 100}}
                - {id: 4, type: terms, field: service, settings: {interval: 1m, min_doc_count: 1, order: desc, orderBy: _term, size: 100}}
        noDataState: OK
        execErrState: Error 
        isPaused: true
        record:
          metric: sli_logwriter_1m
          from: A
          targetDatasourceUid: prometheus
  - folder: Recording Rules
    name: SLI Recording Rules Backend
    interval: 1m
    rules:
      - uid: sli_backend_success_count_1m
        title: sli_success_count_1m
        labels:  
          slo_name: backend
        condition: ""
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum(sli_logwriter_1m{service="backend", status="success"}) or 0 * sum(sli_logwriter_1m{service="backend"})'
              instant: true
              refId: A
        noDataState: OK
        execErrState: Error
        isPaused: false
        record:
          metric: sli_success_count_1m
          from: A
          targetDatasourceUid: prometheus
      - uid: sli_backend_total_count_1m
        title: sli_total_count_1m
        labels:  
          slo_name: backend
        condition: ""
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum(sli_logwriter_1m{service="backend"})'
              instant: true
              refId: A
        noDataState: OK
        execErrState: Error
        isPaused: false
        record:
          metric: sli_total_count_1m
          from: A
          targetDatasourceUid: prometheus
      - uid: sli_backend_5m
        title: sli_5m
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                  dstype: prometheus
                  uid: prometheus
              expr: (sum(sum_over_time(sli_logwriter_1m{service="backend",status="success"}[5m] offset 2m)) or 0 * sum(sum_over_time(sli_logwriter_1m{service="backend"}[5m] offset 2m))) / sum(sum_over_time(sli_logwriter_1m{service="backend"}[5m] offset 2m))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
        labels:
          __grafana_origin: plugin/grafana-slo-app
          slo_name: backend
        isPaused: false
        record:
          metric: grafana_slo_sli_5m
          from: A
          targetDatasourceUid: prometheus
      - uid: sli_backend_window
        title: sli_window
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                  dstype: prometheus
                  uid: prometheus
              expr: sum without (__grafana_origin) (sum_over_time((sli_5m{slo_name="backend"} < +Inf)[30d:5m])) / sum without (__grafana_origin) (count_over_time((sli_5m{slo_name="backend"} < +Inf)[30d:5m]))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
        labels:
          __grafana_origin: plugin/grafana-slo-app
          slo_name: backend
          grafana_slo_window: 30d
        isPaused: false
        record:
          metric: sli_window
          from: A
          targetDatasourceUid: prometheus
      - uid: sli_backend_info
        title: sli_info
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                  dstype: prometheus
                  uid: prometheus
              expr: vector(1)
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
        labels:
          __grafana_origin: plugin/grafana-slo-app
          grafana_slo_dashboard_url: https://dashingparrot1503.grafana.net/d/grafana_slo_app-backend
          grafana_slo_name: backend
          grafana_slo_type: ratio
          slo_name: backend
        isPaused: false
        record:
          metric: sli_info
          from: A
          targetDatasourceUid: prometheus
      - uid: sli_backend_objective
        title: sli_objective
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                  dstype: prometheus
                  uid: prometheus
              expr: vector(0.999500)
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
        labels:
          __grafana_origin: plugin/grafana-slo-app
          slo_name: backend
          grafana_slo_window: 30d
        isPaused: false
        record:
          metric: sli_objective
          from: A
          targetDatasourceUid: prometheus
      - uid: sli_backend_objective_window_seconds
        title: sli_objective_window_seconds
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                  dstype: prometheus
                  uid: prometheus
              expr: vector(2592000)
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
        labels:
          __grafana_origin: plugin/grafana-slo-app
          slo_name: backend
          grafana_slo_window: 30d
        isPaused: false
        record:
          metric: sli_objective_window_seconds
          from: A
          targetDatasourceUid: prometheus
  - folder: Recording Rules
    name: SLI Recording Rules Frontend
    interval: 1m
    rules:  
      - uid: sli_frontend_success_count_1m
        title: sli_success_count_1m
        labels:  
          slo_name: frontend
        condition: ""
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum(sli_logwriter_1m{service="frontend", status="success"}) or 0 * sum(sli_logwriter_1m{service="frontend"})'
              instant: true
              refId: A
        noDataState: OK
        execErrState: Error
        isPaused: false
        record:
          metric: sli_success_count_1m
          from: A
          targetDatasourceUid: prometheus
      - uid: sli_frontend_total_count_1m
        title: sli_total_count_1m
        labels:  
          slo_name: frontend
        condition: ""
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum(sli_logwriter_1m{service="frontend"})'
              instant: true
              refId: A
        noDataState: OK
        execErrState: Error
        isPaused: false
        record:
          metric: sli_total_count_1m
          from: A
          targetDatasourceUid: prometheus